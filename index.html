<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VLSM Tutor & Subnetting Master Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <!-- Header Navigation -->
    <header>
      <div class="logo">
        <div class="logo-icon">🖧</div>
        <div>
          <div>VLSM Tutor</div>
          <div class="logo-subtext">Subnetting Master Studio</div>
        </div>
      </div>
      <nav>
        <button class="active">Calculator</button>
        <button>Teach Me</button>
        <button>Practice</button>
        <button>Reference Sheet</button>
      </nav>
      <div class="streak-badge">🔥 0 Streak</div>
    </header>

    <!-- Network Initialization Card -->
    <div class="card">
      <div class="card-title">Network Initialization</div>
      
      <div class="form-group">
        <label for="majorNetwork">Major Network Prefix</label>
        <input type="text" id="majorNetwork" value="192.168.1.0/24" placeholder="e.g. 192.168.1.0/24" />
      </div>

      <div class="card-title">
        <span>Subnet Requirements</span>
        <button class="btn-add" id="btnAddSubnet">+ Add Subnet</button>
      </div>

      <div id="subnetRows">
        <div class="subnet-row">
          <input type="text" value="LAN_A" placeholder="Subnet Name" />
          <input type="number" value="100" placeholder="Hosts Needed" />
          <button class="btn-icon btn-remove">🗑</button>
        </div>
        <div class="subnet-row">
          <input type="text" value="LAN_B" placeholder="Subnet Name" />
          <input type="number" value="50" placeholder="Hosts Needed" />
          <button class="btn-icon btn-remove">🗑</button>
        </div>
        <div class="subnet-row">
          <input type="text" value="LAN_C" placeholder="Subnet Name" />
          <input type="number" value="20" placeholder="Hosts Needed" />
          <button class="btn-icon btn-remove">🗑</button>
        </div>
        <div class="subnet-row">
          <input type="text" value="WAN_1" placeholder="Subnet Name" />
          <input type="number" value="2" placeholder="Hosts Needed" />
          <button class="btn-icon btn-remove">🗑</button>
        </div>
      </div>

      <button class="btn-primary" id="btnCalculate">⚡ Calculate VLSM</button>
    </div>

    <!-- Space Allocation Metrics -->
    <div class="card">
      <div class="card-title">Space Allocation</div>
      <div class="metrics">
        <div class="metric-box">
          <div class="metric-value" id="usedIps">0 / 0 IPs Used</div>
          <div class="metric-label" id="usedPercentage">0% Capacity</div>
        </div>
        <div class="metric-box">
          <div class="metric-value" id="totalCapacity">0</div>
          <div class="metric-label">Total Capacity</div>
        </div>
        <div class="metric-box">
          <div class="metric-value" id="unassignedIps">0</div>
          <div class="metric-label">Unassigned IPs</div>
        </div>
      </div>
    </div>

    <!-- Allocation Results Table -->
    <div class="card">
      <div class="card-title">
        <span>Allocation Results</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Subnet Name</th>
            <th>Needed</th>
            <th>Allocated</th>
            <th>Network Address</th>
            <th>Usable Range</th>
            <th>Broadcast</th>
          </tr>
        </thead>
        <tbody id="resultsTable">
          <!-- Dynamically populated via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
